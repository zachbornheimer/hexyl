name: fork

# This branch (`fork`) holds only fork config: this caller, the carried topic
# branches (.fork/branches) and recorded conflict resolutions (.fork/rr-cache).
# `master` mirrors upstream and only ever fast-forwards; every topic branch is
# cut from it, so each one is also a clean upstream pull request. Manage it with `fork`.
on:
  push:
    branches: [fork]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the latest release already ships this merge
        type: boolean
        default: false

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: zysys/github-workflows/.github/workflows/fork.yml@96bb022c5d09be1f178692b7b84a5b813976fe9d # v2.0.0-rc.1
    permissions:
      contents: write
    with:
      scripts_ref: 96bb022c5d09be1f178692b7b84a5b813976fe9d
      mirror: master
      binary: hexyl
      check: "cargo test --locked"
      build: "cargo build --release --locked --bin hexyl"
      artifact: target/release/hexyl
      smoke: '"$BIN" --version | grep -q zach'
      targets: >-
        [{"target":"darwin-arm64","os":"macos-latest"},
         {"target":"linux-x64","os":"ubuntu-22.04"}]
      force: ${{ inputs.force || false }}
